<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกสต็อกสินค้า | Stock Record</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SheetJS Excel Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">📦</div>
            <h1>บันทึกสต็อกออเดอร์</h1>
            <p>เพิ่มข้อมูลคำสั่งซื้อใหม่ลงในระบบ</p>
            <a href="dashboard.html" style="display:inline-block; margin-top:1rem; padding:0.5rem 1.2rem; background:rgba(99,102,241,0.15); border:1px solid rgba(99,102,241,0.4); color:#818cf8; border-radius:10px; text-decoration:none; font-size:0.9rem; transition:all 0.2s;" onmouseover="this.style.background='rgba(99,102,241,0.3)'" onmouseout="this.style.background='rgba(99,102,241,0.15)'">
                📊 ดูแดชบอร์ด
            </a>
        </header>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" id="manualTabBtn">บันทึกด้วยมือ</button>
            <button class="tab-btn" id="uploadTabBtn">อัปโหลดไฟล์ (Lazada/Shopee/TikTok)</button>
        </div>

        <div id="manualSection">
            <form id="stockForm" class="glass-form">
            <div class="form-grid">
                <!-- วันที่สั่งซื้อ -->
                <div class="input-group">
                    <label for="orderDate">วันที่สั่งซื้อ</label>
                    <input type="date" id="orderDate" name="orderDate" required>
                </div>

                <!-- แพลตฟอร์ม -->
                <div class="input-group">
                    <label for="platform">แพลตฟอร์ม</label>
                    <select id="platform" name="platform" required>
                        <option value="" disabled selected>เลือกแพลตฟอร์ม...</option>
                        <option value="Shopee">Shopee 🟧</option>
                        <option value="Lazada">Lazada 🟦</option>
                        <option value="TikTok">TikTok ⬛</option>
                        <option value="Other">อื่นๆ</option>
                    </select>
                </div>

                <!-- เลขคำสั่งซื้อ -->
                <div class="input-group">
                    <label for="orderNumber">เลขคำสั่งซื้อ</label>
                    <input type="text" id="orderNumber" name="orderNumber" placeholder="เช่น 230526XXXXXX" required>
                </div>

                <!-- เลขพัสดุ -->
                <div class="input-group">
                    <label for="trackingNumber">เลขพัสดุ</label>
                    <input type="text" id="trackingNumber" name="trackingNumber" placeholder="เช่น TH1234567890">
                </div>

                <!-- SKU -->
                <div class="input-group full-width">
                    <label for="productCode">SKU <span id="productFetchStatus" style="font-size: 0.8rem; margin-left: 10px;"></span></label>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="productCode" name="productCode" placeholder="ระบุ SKU แล้วกดปุ่มค้นหา ➔" style="flex: 1;">
                        <button type="button" id="btnFetchSku" class="btn btn-primary" style="padding: 0 15px;">🔍 ดึงข้อมูล</button>
                    </div>
                </div>

                <!-- ชื่อสินค้า -->
                <div class="input-group full-width">
                    <label for="productName">ชื่อสินค้า</label>
                    <input type="text" id="productName" name="productName" placeholder="ระบุชื่อสินค้า" required>
                </div>

                <!-- ขนาด -->
                <div class="input-group">
                    <label for="productSize">ขนาด</label>
                    <input type="text" id="productSize" name="productSize" placeholder="เช่น S, M, L, XL (ถ้ามี)">
                </div>

                <!-- จำนวนช่อง -->
                <div class="input-group">
                    <label for="slots">จำนวนช่อง</label>
                    <input type="number" id="slots" name="slots" placeholder="จำนวนช่อง (ถ้ามี)" min="0">
                </div>

                <!-- ลาย -->
                <div class="input-group">
                    <label for="pattern">ลาย</label>
                    <input type="text" id="pattern" name="pattern" placeholder="ลายตกแต่ง (จะดึงอัตโนมัติจาก SKU)" readonly style="background: rgba(99,102,241,0.05); color: #818cf8;">
                </div>

                <!-- จำนวน -->
                <div class="input-group">
                    <label for="quantity">จำนวน</label>
                    <input type="number" id="quantity" name="quantity" placeholder="0" min="1" required>
                </div>

                <!-- ราคาสินค้า -->
                <div class="input-group">
                    <label for="price">ราคาสินค้ารวม (บาท)</label>
                    <input type="number" id="price" name="price" placeholder="0.00" step="0.01" required>
                </div>

                <!-- ค่าจัดส่ง -->
                <div class="input-group">
                    <label for="shippingFee">ค่าจัดส่ง (บาท)</label>
                    <input type="number" id="shippingFee" name="shippingFee" placeholder="0.00" step="0.01" value="0.00">
                </div>

                <!-- ผู้ซื้อ -->
                <div class="input-group full-width">
                    <label for="buyerName">ผู้ซื้อ</label>
                    <input type="text" id="buyerName" name="buyerName" placeholder="ชื่อลูกค้า" required>
                </div>

                <!-- เบอร์โทร (ยกเลิกการเก็บตามคำขอ)
                <div class="input-group">
                    <label for="phone">เบอร์โทรศัพท์</label>
                    <input type="tel" id="phone" name="phone" placeholder="0812345678">
                </div>
                -->

                <!-- จังหวัด -->
                <div class="input-group">
                    <label for="province">จังหวัด</label>
                    <input type="text" id="province" name="province" placeholder="ระบุจังหวัด" required>
                </div>

                <!-- ที่อยู่ -->
                <div class="input-group full-width">
                    <label for="address">ที่อยู่จัดส่ง</label>
                    <input type="text" id="address" name="address" placeholder="บ้านเลขที่ ถนน ตำบล อำเภอ"></div>

                <!-- รูปภาพใบbook -->
                <div class="input-group full-width">
                    <label for="bookImage">อัปโหลดรูปภาพใบbook / สลิป (ถ้ามี)</label>
                    <input type="file" id="bookImage" name="bookImage" accept="image/*" style="padding: 0.5rem 0.8rem; background: rgba(10, 15, 30, 0.6); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Kanit', sans-serif;">
                </div>

                <!-- หมายเหตุ -->
                <div class="input-group full-width">
                    <label for="note">หมายเหตุ</label>
                    <input type="text" id="note" name="note" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)">
                </div>

                <!-- สถานะ -->
                <div class="input-group">
                    <label for="status">สถานะ</label>
                    <select id="status" name="status" required>
                        <option value="รอดำเนินการ">รอดำเนินการ (Pending)</option>
                        <option value="กำลังจัดส่ง">กำลังจัดส่ง (Shipping)</option>
                        <option value="จัดส่งสำเร็จ">จัดส่งสำเร็จ (Delivered)</option>
                        <option value="ยกเลิก">ยกเลิก (Cancelled)</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-primary" id="submitBtn">
                    <span class="btn-text">บันทึกข้อมูล</span>
                    <span class="btn-loader" style="display: none;">กำลังบันทึก...</span>
                </button>
            </div>
            
            <div id="statusMessage" class="status-message"></div>
        </form>
        </div>

        <!-- Upload Section -->
        <div id="uploadSection" class="glass-form" style="display: none;">
            <div class="form-grid">
                <div class="input-group full-width" style="text-align: center;">
                    <h2>อัปโหลดไฟล์รายงานยอดขาย</h2>
                    <p style="color: #cbd5e1; margin-top: 5px;">รองรับไฟล์ Excel ของ Lazada, Shopee และ TikTok (.xlsx, .xls, .csv)</p>
                </div>

                <div class="input-group full-width">
                    <label for="fileInput" class="file-drop-zone" id="dropZone">
                        <span id="fileNameDisplay" style="font-size: 1.1rem; color: #818cf8;">📂 ลากไฟล์มาวาง หรือ คลิกเพื่อเลือกไฟล์</span>
                        <input type="file" id="fileInput" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" style="opacity: 0; position: absolute; z-index: -1;">
                    </label>
                </div>
            </div>

            <div id="previewSection" style="display: none; margin-top: 2rem;">
                <h3 style="margin-bottom: 1rem; color: #818cf8;">ตัวอย่างข้อมูลที่จะบันทึก (<span id="previewCount">0</span> รายการ)</h3>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>แพลตฟอร์ม</th>
                                <th>วันที่</th>
                                <th>เลขคำสั่งซื้อ</th>
                                <th>เลขพัสดุ</th>
                                <th>SKU</th>
                                <th>ชื่อสินค้า</th>
                                <th>ขนาด</th>
                                <th>ช่อง</th>
                                <th>จำนวน/ราคา</th>
                                <th>หมายเหตุ</th>
                            </tr>
                        </thead>
                        <tbody id="previewBody">
                        </tbody>
                    </table>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-primary" id="bulkUploadBtn">
                        <span class="btn-text">บันทึกข้อมูลทั้งหมดลงฐานข้อมูล</span>
                        <span class="btn-loader" style="display: none;">กำลังบันทึก...</span>
                    </button>
                </div>
            </div>
        </div>
        </div>
    </div>

    <!-- System Log Terminal (Hidden by default, shows on save) -->
    <div class="log-container" id="statusLog"></div>

    <script src="app.js"></script>
</body>
</html>
